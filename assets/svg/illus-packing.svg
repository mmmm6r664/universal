<path d="M210 230 L280 200 L400 200 L330 230 Z" fill="#f2b974"/>
<path d="M270 230 L270 380" stroke="#cf8f4f" stroke-width="3"/>
<rect x="250" y="226" width="40" height="10" fill="#fff" opacity=".7"/>
</g>
<!-- small box -->
<g>
<path d="M120 300 L210 300 L210 380 L120 380 Z" fill="#e8a765"/>
<path d="M210 300 L255 282 L255 362 L210 380 Z" fill="#cf8f4f"/>
