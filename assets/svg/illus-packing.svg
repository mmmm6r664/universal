<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="Packing and moving boxes">
<rect width="640" height="480" rx="28" fill="#eef1ff"/>
<circle cx="520" cy="130" r="70" fill="#dbe4ff"/>
<path d="M60 380 H600" stroke="#c3cdf2" stroke-width="4"/>
